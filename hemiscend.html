
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemiscend - AI Solution Platform</title>
    <!-- 加載 Inter 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* 基礎設置 */
        :root {
            --font-primary: 'Inter', sans-serif;
            --color-text: #1a1a1a; /* 近黑色 */
            --color-background: #ffffff; /* 純白色 */
            --max-width: 700px;
            --padding-mobile: 1.5rem;
            --padding-desktop: 3rem;
        }

        body {
            font-family: var(--font-primary);
            color: var(--color-text);
            background-color: var(--color-background);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
            padding: var(--padding-mobile);
            text-align: center;
        }

        /* 標題與 LOGO 樣式 */
        .logo {
            font-size: 3.5rem;
            font-weight: 800; /* Extra Bold */
            letter-spacing: -2px;
            margin-bottom: 0.25rem;
        }

        .tagline {
            font-size: 1.25rem;
            font-weight: 600; /* Semi Bold */
            color: #4b5563; /* 柔和的灰色 */
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* 聯繫資訊 */
        .contact-info {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
            font-size: 1rem;
            color: #6b7280;
        }

        .contact-info a {
            color: var(--color-text);
            font-weight: 600;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        /* 響應式調整 */
        @media (min-width: 768px) {
            .container {
                padding: var(--padding-desktop);
            }
            .logo {
                font-size: 5rem;
            }
            .tagline {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 公司名稱/LOGO -->
        <h1 class="logo">Hemiscend</h1>

        <!-- 公司的簡短口號/描述 -->
        <p class="tagline">
            Building the next generation of collaborative AI tools.
            <br>
            Empowering professionals with multi-AI verification and structured workflow.
        </p>
 
        <!-- 聯繫資訊 -->
        <div class="contact-info">
            Inquiries: 
            <a href="mailto:contact@hemiscend.com">contact@hemiscend.com</a>
        </div>
    </div>
</body>
</html>
